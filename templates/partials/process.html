{% load i18n site_tags %}<ol class="timeline" data-process>
  {% for icon_name, title, text in process %}
    <li class="tl-step reveal" data-delay="{{ forloop.counter0 }}" style="--step: {{ forloop.counter0 }}">
      <div class="tl-node" aria-hidden="true"><span class="num">{{ forloop.counter|stringformat:"02d"|local_digits }}</span></div>
      <div class="tl-card">
        <span class="tl-ic">{% icon icon_name 30 %}</span>
        <h3><span class="visually-hidden">{% translate "Step" %} {{ forloop.counter|local_digits }}: </span>{{ title }}</h3>
        <p>{{ text }}</p>
      </div>
    </li>
  {% endfor %}
</ol>

{% load static site_tags %}<title>{{ seo.title }}</title>
<meta name="description" content="{{ seo.description }}">
<link rel="canonical" href="{{ seo.canonical }}">
{% for alt in seo.alternates %}<link rel="alternate" hreflang="{{ alt.lang }}" href="{{ alt.url }}">
{% endfor %}<link rel="alternate" hreflang="x-default" href="{{ seo.x_default }}">
<meta property="og:type" content="{{ seo.type }}">
<meta property="og:site_name" content="{{ company|tr:'name' }}">
<meta property="og:title" content="{{ seo.title }}">
<meta property="og:description" content="{{ seo.description }}">
<meta property="og:url" content="{{ seo.canonical }}">
<meta property="og:image" content="{{ seo.image }}">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:locale" content="{{ seo.locale }}">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="{{ seo.title }}">
<meta name="twitter:description" content="{{ seo.description }}">
<meta name="twitter:image" content="{{ seo.image }}">
{% if company %}<script type="application/ld+json">{{ company_jsonld|safe }}</script>{% endif %}

{% load i18n %}<figure class="route-map glass-dark reveal" data-route-map style="margin:0">
  <svg viewBox="0 0 800 520" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="rm-title rm-desc">
    <title id="rm-title">{% translate "Map of our active international routes" %}</title>
    <desc id="rm-desc">{% for r in routes %}{{ r.origin_en }} – {{ r.destination_en }}{% if not forloop.last %}; {% endif %}{% endfor %}</desc>
    <defs>
      <path id="p-tr-ir" d="M330 235 Q 470 215 600 300"/>
      <path id="p-ir-tr" d="M600 300 Q 455 300 330 235"/>
      <path id="p-ir-eu" d="M600 300 Q 380 40 110 150"/>
      <path id="p-ir-iq" d="M600 300 Q 540 390 420 400"/>
      <path id="p-ir-az" d="M600 300 Q 655 220 590 150"/>
    </defs>
    <g aria-hidden="true">
      {% for key in route_keys %}
        <use href="#p-{{ key }}" class="rm-path"/>
        <use href="#p-{{ key }}" class="rm-flow" data-route-line="{{ key }}"/>
        <circle r="4.5" class="rm-truck"><animateMotion dur="{% cycle '5.5s' '6.5s' '8s' '4.5s' '5s' %}" repeatCount="indefinite" rotate="auto"><mpath href="#p-{{ key }}"/></animateMotion></circle>
      {% endfor %}

      {# Border crossings used for transit (Iran–Turkey and Iran–Azerbaijan/Nakhchivan) #}
      <g class="rm-border"><circle cx="512" cy="243" r="4"/><text x="512" y="232" text-anchor="middle">{% translate "Razi" %}</text></g>
      <g class="rm-border"><circle cx="487" cy="282" r="4"/><text x="478" y="300" text-anchor="middle">{% translate "Bazargan" %}</text></g>
      <g class="rm-border"><circle cx="540" cy="292" r="4"/><text x="548" y="318" text-anchor="middle">{% translate "Serow" %}</text></g>
      <g class="rm-border"><circle cx="622" cy="208" r="4"/><text x="660" y="212" text-anchor="middle">{% translate "Jolfa" %}</text></g>

      <g class="rm-node"><circle class="ring" cx="110" cy="150" r="14"/><circle class="core" cx="110" cy="150" r="5"/><text x="110" y="186" text-anchor="middle">{% translate "Europe" %}</text><text class="sub" x="110" y="128" text-anchor="middle">EU</text></g>
      <g class="rm-node"><circle class="ring" cx="330" cy="235" r="14"/><circle class="core" cx="330" cy="235" r="5"/><text x="318" y="272" text-anchor="middle">{% translate "Turkey" %}</text><text class="sub" x="330" y="213" text-anchor="middle">TR</text></g>
      <g class="rm-node"><circle class="ring" cx="590" cy="150" r="14"/><circle class="core" cx="590" cy="150" r="5"/><text x="590" y="122" text-anchor="middle">{% translate "Azerbaijan" %}</text><text class="sub" x="560" y="155" text-anchor="middle">AZ</text></g>
      <g class="rm-node"><circle class="ring" cx="420" cy="400" r="14"/><circle class="core" cx="420" cy="400" r="5"/><text x="420" y="436" text-anchor="middle">{% translate "Iraq" %}</text><text class="sub" x="390" y="405" text-anchor="middle">IQ</text></g>
      <g class="rm-node rm-node--hub"><circle class="ring" cx="600" cy="300" r="22"/><circle class="core" cx="600" cy="300" r="8"/><text x="650" y="345" text-anchor="middle">{% translate "Iran" %}</text><text class="sub" x="640" y="305" text-anchor="middle">IR</text></g>
    </g>
  </svg>
  <figcaption class="legend">
    <span><i></i>{% translate "Active route" %}</span>
    <span><i class="b"></i>{% translate "Transit border crossing" %}</span>
  </figcaption>
</figure>

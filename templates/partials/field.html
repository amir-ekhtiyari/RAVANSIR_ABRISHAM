{% load site_tags %}<div class="field{% if field.errors %} has-error{% endif %}{% if wide %} span-2{% endif %}" data-field="{{ field.name }}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if field.field.required %}<span class="req" aria-hidden="true">*</span>{% elif field.help_text == optional_text %}<span class="opt">({{ field.help_text }})</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text and field.help_text != optional_text %}<span class="help" id="{{ field.auto_id }}_help">{{ field.help_text }}</span>{% endif %}
  <span class="error" id="{{ field.auto_id }}_error" role="alert">{% for e in field.errors %}{% icon 'circle-alert' 15 %}{{ e }}{% endfor %}</span>
</div>
